name: fork release
# Builds downloadable Horizon folders from THIS fork and publishes them as a GitHub release on
# rubiidev18alt/horizon-free. Everything runs on GitHub's own runners (ubuntu/windows/macos-latest),
# with no machine of the maintainers', because .github/workflows/game-build.yml needs the Mac mini
# and the launcher.yml release line needs the RELEASE_SIGNING_KEY of the upstream `release`
# environment. docs/fork-release.md explains what this one leaves out.
#
# The game folders hold none of Minecraft's files: players prepare those from their own copy with
# `horizon-prepare --prepare --server-jar ...`, exactly as packaging/PLAY.txt says. The bundle of
# our compiled exporter classes (`exporters/`) is what upstream's `exporters` job makes on the
# Mac mini; without a Minecraft install no job here can compile it, so a build can either be given
# one as the `exporters` input or ship without it (`horizon-prepare compile-exporters` then builds
# the classes at preparation time, which needs a JDK 25 instead of a Java runtime).
#
#   gh workflow run "fork release"                                   # dry run: builds, publishes nothing
#   gh workflow run "fork release" -f publish=true                   # build and publish
#   git tag fork-v1 <main commit> && git push origin fork-v1         # build and publish fork-v1
#
# A tag pushed whose name starts with `fork-v` is the release trigger that needs no API token:
# the run builds that commit (it must be on main) and publishes it under the tag's own name.
on:
  push:
    tags: ['fork-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (default fork-v<run number>)
        type: string
        default: ''
      version:
        description: HORIZON_VERSION built into the programs (default 0.2.<run number>)
        type: string
        default: ''
      publish:
        description: Publish a GitHub release (off builds everything and publishes nothing)
        type: boolean
        default: false
      platforms:
        description: Which platforms to build
        type: choice
        options:
          - all
          - linux
          - windows
          - macOS
        default: all
      exporters:
        description: URL of an original-exporters artifact zip (optional)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"

jobs:
  plan:
    # One place decides the tag, the version and who publishes, so build jobs only get the inputs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      game_matrix: ${{ steps.plan.outputs.game_matrix }}
      launcher_matrix: ${{ steps.plan.outputs.launcher_matrix }}
    steps:
      - id: plan
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          PLATFORMS: ${{ inputs.platforms }}
          NUMBER: ${{ github.run_number }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag=${TAG:-fork-v$NUMBER}
          # The version goes into the programs (horizon_core::release): no version commits, no `v`.
          version=${VERSION:-0.2.$NUMBER}
          publish=$PUBLISH
          if [[ "$EVENT" == push ]]; then
            # A `fork-v*` tag is the release: its name is the tag and it publishes.
            tag=${REF#refs/tags/}
            publish=true
          fi
          [[ "" != "$tag" && "" != "$version" ]] || { echo "::error::empty tag or version"; exit 1; }
          # Nothing else off the default branch publishes: a release has to name a commit on main.
          if [[ "$EVENT" != push && "$REF" != refs/heads/main ]]; then
            echo "::notice::$REF is not main: this run builds and publishes nothing"
            publish=false
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          # The build matrices, one set of platform definitions: a job-level `if` cannot read
          # `matrix`, so the platform chosen here is what the matrix holds.
          python3 - "$PLATFORMS" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          platforms = sys.argv[1] or "all"
          game = [
              {"name": "linux", "os": "ubuntu-22.04", "dir": "horizon-linux-x86_64",
               "asset": "horizon-linux-x86_64.tar.gz", "exe": "", "rustflags": ""},
              {"name": "windows", "os": "windows-latest", "dir": "horizon-windows-x64",
               "asset": "horizon-windows-x64.zip", "exe": ".exe",
               "rustflags": "-C target-feature=+crt-static"},
              {"name": "macOS", "os": "macos-latest", "dir": "horizon-macos-arm64",
               "asset": "horizon-macos-arm64.zip", "exe": "", "rustflags": ""},
          ]
          launcher = [
              {"name": "linux", "os": "ubuntu-22.04", "binary": "horizon-launcher",
               "asset": "horizon-launcher-linux-x86_64", "rustflags": ""},
              {"name": "windows", "os": "windows-latest", "binary": "horizon-launcher.exe",
               "asset": "horizon-launcher-windows-x64.exe",
               "rustflags": "-C target-feature=+crt-static"},
              {"name": "macOS", "os": "macos-latest", "binary": "horizon-launcher",
               "asset": "horizon-launcher-macos-arm64", "rustflags": ""},
          ]
          picked = lambda rows: [row for row in rows if platforms in ("all", row["name"])]
          print("game_matrix=" + json.dumps({"include": picked(game)}, separators=(",", ":")))
          print("launcher_matrix=" + json.dumps({"include": picked(launcher)}, separators=(",", ":")))
          PY
          echo "### $tag (version $version), publish: $publish, platforms: $PLATFORMS" >> "$GITHUB_STEP_SUMMARY"

  exporters:
    # The compiled original exporter classes the release folders carry, when a run is given them.
    # Without them the folder ships none and `horizon-prepare compile-exporters` builds the classes
    # while it prepares (a JDK 25 rather than a Java runtime). An empty artifact is not an error.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: An artifact zip's URL
        env:
          URL: ${{ inputs.exporters }}
        run: |
          set -euo pipefail
          rm -rf exporters && mkdir -p exporters
          if [[ -n "$URL" ]]; then
            curl -fsSL --retry 3 -o /tmp/exporters.zip "$URL"
            unzip -q /tmp/exporters.zip -d /tmp/exporters
            # The bundle may be zipped either flat or under a single folder.
            manifest=$(find /tmp/exporters -name manifest.json -print -quit)
            [[ -n "$manifest" ]] || { echo "::error::no manifest.json in $URL"; exit 1; }
            cp -R "$(dirname "$manifest")"/. exporters/
          else
            echo "::notice::No exporters: horizon-prepare compiles them while it prepares (that needs a JDK 25)"
            # A marker, so the artifact exists and the game jobs' download succeeds; xtask only
            # copies a bundle that has a manifest.json, so this never reaches a release folder.
            echo "No exporter bundle in this build." > exporters/README.txt
          fi
          ls -la exporters
      - uses: actions/upload-artifact@v4
        with:
          name: exporters
          path: exporters/
          if-no-files-found: warn
          retention-days: 3

  game:
    needs: [plan, exporters]
    name: game ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.game_matrix) }}
    runs-on: ${{ matrix.os }}
    # A release build is LTO and one codegen unit (Cargo.toml): slow to compile, slow to link.
    timeout-minutes: 180
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # The version built into the programs: --version, user agents, crash reports and telemetry.
      HORIZON_VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fork-release-${{ matrix.name }}
      - name: The libraries the client links against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: exporters
          path: exporters
      - name: Build the client, horizon-ctl, horizon-prepare and horizon-server
        run: |
          if cargo build --release --locked -p horizon-client --bin horizon-client --bin horizon-ctl \
              -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server > build.log 2>&1; then
            exit 0
          fi
          # A short excerpt only: a step log that big loses its annotations. The whole log is kept
          # for the report job.
          excerpt=$(grep -E -m 12 '^error(\[|:)' -A 5 build.log || tail -20 build.log)
          printf '%s\n' "$excerpt" | head -60 | while IFS= read -r line; do echo "::error::$line"; done
          exit 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-${{ matrix.name }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Every program the release folder takes was built
        run: |
          set -euo pipefail
          for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do
            test -f "target/release/$binary${{ matrix.exe }}" || { echo "::error::target/release/$binary${{ matrix.exe }} is missing"; exit 1; }
          done
      - name: Only system libraries
        # Windows: no non-system DLL (a "DLL not found" dialog on some players' machines). Linux: the
        # standard loader and the libraries every desktop distribution has.
        if: runner.os != 'macOS'
        run: |
          exec > >(tee imports.log) 2>&1
          set -euo pipefail
          for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do
            ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/check_imports.py "target/release/$binary${{ matrix.exe }}"
          done
      - name: Every program starts, with the version of this build
        run: |
          set -euo pipefail
          bin=target/release
          "$bin/horizon-client${{ matrix.exe }}" --help | grep -q -- '--resources'
          "$bin/horizon-ctl${{ matrix.exe }}" --help > /dev/null
          "$bin/horizon-prepare${{ matrix.exe }}" --help | grep -q -- '--minecraft-dir'
          for binary in horizon-prepare horizon-server; do
            out=$("$bin/$binary${{ matrix.exe }}" --version | tr -d '\r')
            echo "$out"
            [[ "$out" == "$binary $HORIZON_VERSION" ]] || { echo "::error::expected $binary $HORIZON_VERSION"; exit 1; }
          done
      - name: Package
        run: |
          exec > >(tee package.log) 2>&1
          set -euo pipefail
          cargo run --locked -p xtask -- package "target/release/horizon-client${{ matrix.exe }}" "dist/${{ matrix.dir }}"
          cd dist
          if [[ "${{ matrix.asset }}" == *.tar.gz ]]; then
            tar czf "${{ matrix.asset }}" "${{ matrix.dir }}"
          elif [[ "$RUNNER_OS" == Windows ]]; then
            7z a -tzip "${{ matrix.asset }}" "${{ matrix.dir }}" > /dev/null
          else
            # Without resource forks and extended attributes: plain ditto adds an
            # AppleDouble `._` file beside every file that has any.
            ditto -c -k --norsrc --noextattr --noqtn --keepParent "${{ matrix.dir }}" "${{ matrix.asset }}"
            if unzip -Z1 "${{ matrix.asset }}" | grep -E '(^|/)(\._|__MACOSX/)'; then
              echo "::error::macOS metadata files in ${{ matrix.asset }}"; exit 1
            fi
          fi
          ls -l "${{ matrix.asset }}"
      - name: The archive holds a playable folder
        run: |
          exec > >(tee unpack.log) 2>&1
          set -euo pipefail
          unpacked="$RUNNER_TEMP/unpacked"
          rm -rf "$unpacked" && mkdir -p "$unpacked"
          if [[ "${{ matrix.asset }}" == *.tar.gz ]]; then
            tar xzf "dist/${{ matrix.asset }}" -C "$unpacked"
          elif [[ "$RUNNER_OS" == Windows ]]; then
            7z x -o"$unpacked" "dist/${{ matrix.asset }}" > /dev/null
          else
            unzip -q "dist/${{ matrix.asset }}" -d "$unpacked"
          fi
          folder="$unpacked/${{ matrix.dir }}"
          for name in horizon-client horizon-ctl horizon-prepare horizon-server; do
            test -f "$folder/$name${{ matrix.exe }}" || { echo "::error::$name is not in ${{ matrix.asset }}"; exit 1; }
          done
          for name in PLAY.txt research-lock.json LICENSE; do
            test -f "$folder/$name" || { echo "::error::$name is not in ${{ matrix.asset }}"; exit 1; }
          done
          test -d "$folder/tools" || { echo "::error::the sources a release folder carries are missing"; exit 1; }
          "$folder/horizon-client${{ matrix.exe }}" --help | grep -q -- '--resources'
      - name: A server folder too
        if: runner.os == 'Linux'
        # packaging/server/install.sh installs this one on a Linux VPS (docs/server.md).
        run: |
          exec > >(tee server.log) 2>&1
          set -euo pipefail
          cargo build --release --locked -p horizon-client --no-default-features --bin horizon-client
          cargo run --locked -p xtask -- package-server target/release/horizon-client dist/horizon-server-linux-x86_64
          (cd dist && tar czf horizon-server-linux-x86_64.tar.gz horizon-server-linux-x86_64)
          ls -l dist/horizon-server-linux-x86_64.tar.gz
      - name: Keep the logs of the steps that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-game-${{ matrix.name }}
          path: |
            build.log
            package.log
            unpack.log
            imports.log
            server.log
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/horizon-server-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  launcher:
    needs: plan
    name: launcher ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.launcher_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # Built in (launcher/src/backend.rs VERSION): the folder's Cargo.toml version unless given.
      HORIZON_LAUNCHER_VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: fork-release-launcher-${{ matrix.name }}
      - name: The libraries GPUI links to
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - name: Metal shaders compiled at run time where the Metal toolchain is missing
        if: runner.os == 'macOS'
        run: |
          if ! xcrun metal --version > /dev/null 2>&1; then
            echo "::notice::No Metal toolchain on this runner: GPUI compiles its shaders at run time"
            echo "LAUNCHER_FEATURES=gpui/runtime_shaders" >> "$GITHUB_ENV"
          fi
      - name: Build the launcher
        run: |
          if cargo build --release --locked ${LAUNCHER_FEATURES:+--features "$LAUNCHER_FEATURES"} > build.log 2>&1; then
            exit 0
          fi
          excerpt=$(grep -E -m 12 '^error(\[|:)' -A 5 build.log || tail -20 build.log)
          printf '%s\n' "$excerpt" | head -60 | while IFS= read -r line; do echo "::error::$line"; done
          exit 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-launcher-${{ matrix.name }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 3
      - name: The version is this build's
        run: |
          set -euo pipefail
          out=$(target/release/${{ matrix.binary }} --version)
          echo "$out"
          [[ "$out" == "horizon-launcher $HORIZON_LAUNCHER_VERSION" ]] || { echo "::error::expected horizon-launcher $HORIZON_LAUNCHER_VERSION"; exit 1; }
      - name: The libraries it needs
        # A warning on Linux, as launcher.yml treats it: a program built on ubuntu-22.04 can ask for
        # GLIBC_2.35 and the newer libstdc++ that distributions current today have.
        if: runner.os != 'macOS'
        run: |
          exec > >(tee imports.log) 2>&1
          set -euo pipefail
          if ! ${{ runner.os == 'Windows' && 'python' || 'python3' }} ../tools/check_imports.py "target/release/${{ matrix.binary }}"; then
            if [[ "$RUNNER_OS" == Linux ]]; then
              echo "::warning::the launcher needs libraries beyond the check's list (see imports.log)"
            else
              exit 1
            fi
          fi
      - name: Package
        # The bare program, as launcher.yml publishes it: it updates itself, and
        # self-replace replaces the file it runs from, which an archive would not.
        run: |
          exec > >(tee package.log) 2>&1
          set -euo pipefail
          mkdir -p out
          cp "target/release/${{ matrix.binary }}" "out/${{ matrix.asset }}"
          ls -l out
      - name: Keep the logs of the steps that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-launcher-${{ matrix.name }}
          path: |
            build.log
            package.log
            imports.log
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.asset }}
          path: launcher/out/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, game, launcher]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The release's tag and notes; the build jobs' token only reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum horizon-* > SHA256SUMS
          cat SHA256SUMS
      - name: The release and its files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Notes: what this build is, what it needs, and what it is not.
          {
            echo "Horizon (this fork), version $VERSION, built from ${SHA:0:7}."
            echo
            echo "The game folders hold none of Minecraft's files: prepare them from your own copy with"
            echo '`./horizon-prepare --prepare --server-jar PATH/TO/server.jar`, then run `./horizon-client`'
            echo "(packaging/PLAY.txt in each folder has the details, and the launcher does all of it for you)."
            echo
            echo "These archives are checksummed (\`SHA256SUMS\`) but **not signed**: the release signing key"
            echo "belongs to the upstream Horizon release environment, so the official launcher refuses these"
            echo "builds on purpose. They are not an official Horizon release."
            echo
            echo "| Platform | Game | Launcher |"
            echo "| --- | --- | --- |"
            echo "| Linux x86-64 | \`horizon-linux-x86_64.tar.gz\` (server: \`horizon-server-linux-x86_64.tar.gz\`) | \`horizon-launcher-linux-x86_64\` (make it executable) |"
            echo "| Windows x64 | \`horizon-windows-x64.zip\` | \`horizon-launcher-windows-x64.exe\` |"
            echo "| macOS (Apple Silicon) | \`horizon-macos-arm64.zip\` | \`horizon-launcher-macos-arm64\` (make it executable) |"
            echo
            echo "Built by run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } > notes.md
          assets=(dist/horizon-linux-x86_64.tar.gz dist/horizon-windows-x64.zip dist/horizon-macos-arm64.zip)
          assets+=(dist/horizon-server-linux-x86_64.tar.gz)
          assets+=(dist/horizon-launcher-linux-x86_64 dist/horizon-launcher-windows-x64.exe dist/horizon-launcher-macos-arm64)
          assets+=(dist/SHA256SUMS)
          present=()
          for asset in "${assets[@]}"; do
            if [[ -f "$asset" ]]; then present+=("$asset"); fi
          done
          [[ ${#present[@]} -gt 0 ]] || { echo "::error::no assets were built"; exit 1; }
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${present[@]}" --clobber
          else
            gh release create "$TAG" --target "$SHA" --title "Horizon (fork) $VERSION" --notes-file notes.md "${present[@]}"
          fi
          echo "### Published [$TAG](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
      - name: The published files are the ones SHA256SUMS lists
        # Downloaded from the release (no token: they are public), so this checks what players
        # get, not what the build folder held.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          exec > >(tee verify.log) 2>&1
          set -euo pipefail
          # Each stage announces itself, so a failure in the log says where it stopped, and no
          # pipeline ends in `head` (a closed pipe is exit 141 under pipefail).
          fail() {
            # Annotations survive where the log needs a sign-in: the stage, then the tail.
            stage=$(grep -o 'check:[^ ]*: [^:]*' verify.log | tail -1 || true)
            echo "::error::the release check stopped at: ${stage:-unknown}"
            while IFS= read -r line; do echo "::error::$line"; done <<< "$(tail -40 verify.log)"
            exit 1
          }
          trap 'status=$?; if [[ $status -ne 0 ]]; then fail; fi' ERR
          echo "stage: download the release's own files"
          mkdir -p published
          gh release download "$TAG" --dir published
          ls -l published
          echo "stage: checksums"
          ( cd published && sha256sum --check --strict SHA256SUMS )
          echo "stage: unpack every archive"
          for asset in horizon-linux-x86_64.tar.gz horizon-server-linux-x86_64.tar.gz horizon-macos-arm64.zip horizon-windows-x64.zip; do
            rm -rf unpacked && mkdir unpacked
            if [[ "$asset" == *.tar.gz ]]; then
              tar xzf "published/$asset" -C unpacked
            else
              unzip -q "published/$asset" -d unpacked
            fi
            folder=""
            for candidate in unpacked/*/; do folder=${candidate%/}; break; done
            [[ -n "$folder" ]] || { echo "::error::$asset holds no folder"; exit 1; }
            echo "$asset -> $folder"
            ls "$folder"
            echo "check: $asset: folder"
            if [[ "$asset" == horizon-server-* ]]; then
              # A server folder holds the engine (the client without audio or controllers),
              # horizon-server and horizon-prepare (xtask package-server).
              for program in horizon-engine horizon-server horizon-prepare; do
                echo "check: $asset: $program"
                [[ -f "$folder/$program" ]] || { echo "::error::$asset has no $program"; exit 1; }
              done
            else
              echo "check: $asset: horizon-client"
              [[ -f "$folder/horizon-client" || -f "$folder/horizon-client.exe" ]] \
                || { echo "::error::$asset has no horizon-client"; exit 1; }
              echo "check: $asset: PLAY.txt"
              [[ -f "$folder/PLAY.txt" ]] || { echo "::error::$asset has no PLAY.txt"; exit 1; }
              echo "check: $asset: horizon-ctl"
              [[ -f "$folder/horizon-ctl" || -f "$folder/horizon-ctl.exe" ]] \
                || { echo "::error::$asset has no horizon-ctl"; exit 1; }
            fi
          done
          echo "stage: the launcher runs"
          chmod +x published/horizon-launcher-linux-x86_64
          published/horizon-launcher-linux-x86_64 --version
          echo "the published release checks out"
      - name: Keep the log if the published release did not check out
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-publish
          path: verify.log
          if-no-files-found: ignore
          retention-days: 3

  report:
    # Job logs are only readable while signed in; a commit comment is not. When a build fails,
    # this posts the first compiler errors of every platform that failed.
    needs: [plan, game, launcher, publish]
    if: always() && (needs.game.result == 'failure' || needs.launcher.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the commit comment
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          path: logs
      - name: The first errors of each platform
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/comment.md"
          {
            echo "### \`fork release\` build failed ([run]($RUN))"
            echo
          } > "$body"
          for log in logs/*/*.log; do
            [[ -f "$log" ]] || continue
            name=$(basename "$(dirname "$log")")/$(basename "$log")
            {
              echo "<details><summary><b>$name</b></summary>"
              echo
              echo '```'
              grep -E -m 20 '^error(\[|:)' -A 6 "$log" | head -80 || true
              echo '...'
              tail -25 "$log"
              echo '```'
              echo
              echo "</details>"
              echo
            } >> "$body"
          done
          # A commit comment holds 65536 characters.
          head -c 60000 "$body" > "$body.trimmed" || true
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/comments" -F body=@"$body.trimmed" > /dev/null
          echo "posted the compiler output as a comment on $SHA"
